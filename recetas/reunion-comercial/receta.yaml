id: reunion-comercial
nombre: Notas de reunión comercial
descripcion: Ficha de cada reunión con un cliente o prospecto, cruzando el resumen automático del mail con el calendario y la lectura de la persona.
version: 1
disparador:
  tipo: a_pedido
  ventana: evento
  frases:
    - subí la reunión con
    - cargá la llamada comercial
    - notas de la reunión con
fuentes:
  - id: mail
    para: Resumen automático de la reunión (notetaker) y la invitación del comercial
    requerida: true
  - id: calendario
    para: Fecha real de la reunión, participantes con su nombre (del detalle del evento) y la respuesta de la persona
    requerida: true
  - id: chat
    para: Lo que se habló antes o después de la reunión, si hace falta contexto
pasos:
  - id: lectura
    nombre: Tomar la lectura de la persona
    detalle: Qué quiere realmente el cliente, qué oportunidad ve y cómo lo venderían. Manda sobre el resumen automático. En una corrida desatendida no hay lectura y el paso queda omitido.
  - id: evidencia
    nombre: Buscar resumen y fecha
    detalle: Resumen del notetaker en el mail y fecha real, participantes y respuesta de la persona en el detalle del evento del calendario. Cada búsqueda se registra con registrar_lectura, con todos los ids que devolvió, la consulta y el total.
    usa: [mail, calendario, chat]
  - id: candidatas
    nombre: Revisar las reuniones candidatas
    detalle: Para cada evento de la ventana, las dos condiciones por separado (participantes externos, o un comercial de la lista de personas presente) y si hay resumen. Cada una va a ficha, a "posible, confirmá" o a descartados con su motivo.
  - id: redactar
    nombre: Redactar la ficha
    detalle: Contexto y conclusión, oportunidad, próximos pasos. En las candidatas, la plantilla fija (estado, invitados, comercial asociado, contactos del cliente, campos del destino).
control:
  - La fecha es la de la reunión según el calendario, no la de hoy.
  - Cuenta como comercial si hay participantes externos o un comercial presente, y además un resumen de la reunión. Las dos condiciones se revisan por separado y los eventos con dominios externos excluidos se nombran con su motivo. Un descarte por "comercial presente" nombra a los comerciales de la lista que están en ese evento.
  - Los nombres de los participantes salen del detalle del evento. Nunca se deduce un nombre de una dirección de mail; sin nombre a la vista, va la dirección.
  - Solo es "comercial" o "comercial asociado" alguien de la lista de personas con ese rol. Si una misma persona aparece con un dominio interno y uno externo, se dice, y que la reunión sea con el cliente se rotula como hipótesis.
  - Sin resumen, chat o lectura de la persona que confirme que ocurrió, la reunión está "agendada", con la respuesta de la persona en el calendario (aceptada, tentativa o sin respuesta), y la lista se rotula "Invitados (según calendario)", no "participantes".
  - La oportunidad comercial no se inventa; sin la lectura de la persona, queda solo lo que dice el resumen.
  - Participantes solo internos, salvo que la persona pida otra cosa; los contactos del cliente van en la conclusión.
  - Cada candidata muestra qué quedaría en cada campo del destino y cuáles faltan.
  - Toda ref leída (evento, mail, mensaje) termina en una ficha o en descartados, con su ref y su motivo. Se registran todos los ids que devuelve cada búsqueda, no una selección, y cada ref se describe con su asunto o título real.
  - Lo que le falta a cada candidata (resumen, lectura de la persona) va en faltantes, una línea por insumo y por candidata.
  - Cada búsqueda que se cita como hecha (también las que no dieron resultados) está registrada en la corrida, con el término usado. No se afirma que no hay nada sobre un tema si no se buscó ese tema solo; con una consulta combinada se cita la consulta exacta.
  - El resultado de cada fuente se reporta con conteos que coinciden con lo registrado; la clasificación (candidatas, descartes) se reporta en el paso candidatas, no en la fuente.
destino:
  por_defecto: formulario
  formato: "Ficha con fecha, cliente, participantes internos, comercial asociado y conclusión en tres bloques: contexto y conclusión, oportunidad, próximos pasos. Al final, las candidatas por confirmar (con la plantilla fija) y las fuentes revisadas."
reglas: []
