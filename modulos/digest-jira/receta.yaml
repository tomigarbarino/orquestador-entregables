id: digest-jira
nombre: Digest de Jira con calendario
descripcion: Resumen diario que cruza los tickets que se movieron con las reuniones del día, para llegar a cada reunión sabiendo qué cambió.
version: 1
disparador:
  tipo: horario
  por_defecto:
    dias: [lun, mar, mie, jue, vie]
    hora: "08:30"
  ventana: dia_habil_anterior
  frases:
    - digest de jira
    - qué se movió en jira
fuentes:
  - id: jira
    para: Tickets creados, movidos de estado o comentados en la ventana, en los proyectos configurados
    requerida: true
  - id: calendario
    para: Reuniones de hoy, con su título y participantes
    requerida: true
pasos:
  - id: ventana
    nombre: Definir la ventana
    detalle: Movimientos del día hábil anterior y reuniones de hoy.
  - id: tickets
    nombre: Tickets que se movieron
    usa: [jira]
  - id: reuniones
    nombre: Reuniones de hoy
    usa: [calendario]
  - id: cruzar
    nombre: Cruzar tickets con reuniones
    detalle: Para cada reunión, qué tickets de sus participantes o de su tema cambiaron.
  - id: redactar
    nombre: Redactar el digest
control:
  - Cada ticket mencionado tiene su clave (por ejemplo PROY-123).
  - Un cruce entre reunión y ticket se justifica (participante en común o tema del título); si es una suposición, se dice.
  - No se deduce el contenido de una reunión que todavía no ocurrió.
destino:
  por_defecto: borrador
  formato: "Por cada reunión de hoy: hora, título y los tickets relacionados con su cambio. Al final, tickets movidos que no se cruzan con ninguna reunión."
reglas: []
